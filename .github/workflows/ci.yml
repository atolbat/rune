name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    name: lint + typecheck + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Lint (packages/*/src)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build library
        run: bun run build
      - name: Dist freshness (warn if committed bundle is stale)
        run: git diff --exit-code -- dist/ || echo "::warning::dist/ in the branch differs from a fresh build — commit bun run build (Pages serves the demo from dist)"
      - name: Tests
        run: bun test
      - name: Upload dist artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rune-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  demo:
    name: demo smoke (headless browser)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build library
        run: bun run build
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      - name: Demo smoke (SwiftShader)
        run: bun run demo:smoke
