<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rune — hello cube</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0b0d13;
    color: #dfe5f1;
    font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
  h1 code { color: #7aa2f7; }
  .stage {
    position: relative;
    width: min(840px, 92vw);
    aspect-ratio: 840 / 520;
    border-radius: 12px;
    overflow: hidden;
    background: #07080c;
    box-shadow: 0 20px 60px rgb(0 0 0 / 0.45), inset 0 0 0 1px #1c2230;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .badge {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgb(10 12 18 / 0.7);
    border: 1px solid #26304a;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #9ecbff;
    backdrop-filter: blur(4px);
  }
  #reason {
    display: none;
    position: absolute;
    left: 12px;
    bottom: 12px;
    max-width: 70%;
    margin: 0;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgb(40 16 16 / 0.85);
    border: 1px solid #5a2b2b;
    color: #ffb4b4;
    font-size: 12px;
    white-space: pre-wrap;
  }
  .controls { display: flex; gap: 10px; }
  button {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid #2a3550;
    background: #121826;
    color: #dfe5f1;
    font: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #1a2236; border-color: #3b4a70; }
  p.hint { margin: 0; color: #6b7691; font-size: 13px; }
</style>
</head>
<body>
  <h1><code>rune</code> — hello cube</h1>
  <div class="stage">
    <canvas id="canvas"></canvas>
    <span class="badge" id="backend">…</span>
    <pre id="reason"></pre>
  </div>
  <div class="controls">
    <button id="pause" type="button">Пауза</button>
    <button id="resume" type="button">Продолжить</button>
  </div>
  <p class="hint">showAny(): WebGPU с авто-фолбэком на WebGL2 — один вызов, бейдж показывает активный бэкенд.</p>
  <script type="module" src="./main.js"></script>
</body>
</html>
