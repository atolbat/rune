<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>rune — the dense forest (one tree, instanced)</title>
  <link rel="stylesheet" href="../shared/demo-shell.css?v=223" />
  <style>
    /* THE GAME IS THE SCREEN (the walker's own law): the stage fixes over
     * the viewport — a forest fills the phone. The canvas owns the input. */
    body.rd-fs #app { position: fixed; inset: 0; }
    body.rd-fs #stage { position: absolute; inset: 0; }
    .hiz-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .walker-hud {
      position: absolute; left: 10px; top: 58px; margin: 0;
      padding: 7px 9px; border-radius: 8px;
      background: rgba(8, 10, 16, 0.66); border: 1px solid #26304a;
      color: #9fb4d8; font: 10px/1.5 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre; pointer-events: none; max-width: calc(100% - 20px);
      z-index: 4;
    }
    .walker-hud b { color: #e8b34b; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/demo-shell.js?v=223"></script>
  <script type="module" src="./main.js?v=223"></script>
</body>
</html>
