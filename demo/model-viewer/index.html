<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>rune — model viewer</title>
  <link rel="stylesheet" href="../shared/demo-shell.css" />
  <style>
    /* Model picker: a compact pill + bottom sheet, hidden by default.
       The canvas (inside #rd-slot) fills the whole viewport — the shell mounts
       with layout: 'fullscreen'. Everything below only layers on top of it. */
    .mv-pill {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      max-width: calc(100% - 24px);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #2c3855;
      background: rgb(11 13 19 / 0.78);
      color: #dfe5f1;
      font: 13px/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif;
      backdrop-filter: blur(6px);
      cursor: pointer;
      touch-action: manipulation;
      white-space: nowrap;
      overflow: hidden;
    }
    .mv-pill::after { content: '\25BE'; font-size: 10px; color: #6b7691; }
    .mv-pill[hidden] { display: none; }
    .mv-pill:disabled { opacity: 0.6; cursor: default; }

    /* Bottom sheet: model list + load button + progress + stats. */
    .mv-sheet {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      z-index: 16;
      width: min(400px, calc(100% - 16px));
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 14px;
      background: rgb(11 13 19 / 0.9);
      border: 1px solid #26304a;
      backdrop-filter: blur(10px);
    }
    .mv-sheet[hidden] { display: none; }

    .mv-head { display: flex; align-items: center; justify-content: space-between; }
    .mv-title { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7691; }
    .mv-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid #2c3855;
      background: #121826;
      color: #6b7691;
      font: 14px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .mv-close:hover { color: #dfe5f1; border-color: #3b4a70; }

    .mv-rows { display: flex; flex-direction: column; gap: 4px; }
    .mv-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      width: 100%;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }
    .mv-row .mv-main { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .mv-row b { font-size: 13px; font-weight: 600; color: #dfe5f1; }
    .mv-row .mv-sub { font-size: 11px; color: #6b7691; }
    .mv-row .mv-size { font-size: 11px; color: #6b7691; flex: none; }
    .mv-row[aria-pressed="true"] { border-color: #7aa2f7; background: rgb(26 35 54 / 0.8); }
    .mv-row[aria-pressed="true"] b { color: #9ecbff; }
    .mv-row.mv-loaded .mv-size::after { content: ' \00B7 loaded'; color: #73daca; }

    .mv-load {
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid #7aa2f7;
      background: #1a2336;
      color: #9ecbff;
      font: 14px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
      cursor: pointer;
      padding: 0 14px;
      touch-action: manipulation;
    }
    .mv-load:disabled { opacity: 0.55; cursor: default; }

    .mv-progress { display: none; flex-direction: column; gap: 4px; }
    .mv-progress.mv-active { display: flex; }
    .mv-bar-track {
      height: 6px;
      border-radius: 3px;
      background: #1a2336;
      overflow: hidden;
    }
    .mv-bar {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, #7aa2f7, #73daca);
      transition: width 0.12s linear;
    }
    .mv-status { font: 11px/1.4 system-ui, sans-serif; color: #6b7691; }
    .mv-stats { font: 11px/1.5 system-ui, sans-serif; color: #6b7691; }

    .mv-hint {
      position: absolute;
      left: 12px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      z-index: 14;
      font: 11px/1.4 system-ui, sans-serif;
      color: #6b7691;
      background: rgb(11 13 19 / 0.7);
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    .mv-hint.mv-gone { opacity: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/demo-shell.js"></script>
  <script type="module" src="./main.js?v=120"></script>
</body>
</html>
