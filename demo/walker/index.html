<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>rune — first-person parkour walker</title>
  <link rel="stylesheet" href="../shared/demo-shell.css?v=221" />
  <style>
    /* Task 217 — THE GAME IS THE SCREEN: the shell's fullscreen layout
     * (body.rd-fs) fixes the stage over the whole viewport; the walker's
     * own chrome rides ON TOP — the compact HUD under the FAB, the touch
     * controls in the thumbs' range with safe-area margins. The Task-216
     * letterboxed 16:9 stage (a video player inside a doc page) became
     * the report's own complaint: «канвас на весь экран». */
    .walker-stage { position: relative; }
    .walker-stage canvas {
      /* Task 220 — THE OVERLAY SWAP: the rescue boot's new canvas lands on
         top of the frozen old one (DOM order); absolute stacking keeps
         both over the SAME stage pixels — the swap never shows the page
         background, not even for one frame */
      position: absolute; inset: 0; display: block; width: 100%; height: 100%;
      touch-action: none; /* the pointer events own every touch */
    }
    .walker-hud {
      position: absolute; left: 10px; top: 58px; margin: 0;
      padding: 7px 9px; border-radius: 8px;
      background: rgba(8, 10, 16, 0.66); border: 1px solid #26304a;
      color: #9fb4d8; font: 10px/1.5 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre; pointer-events: none; max-width: calc(100% - 20px);
      z-index: 4;
    }
    .walker-hud b { color: #e8b34b; }
    /* THE VISIBLE JOYSTICK (Task 217): the base ring + the knob, faded
     * in at the touch-down anchor, pointer-events none — the canvas owns
     * the input; this is eyes only */
    .walker-joy {
      position: absolute; width: 116px; height: 116px; border-radius: 50%;
      border: 2px solid rgba(159, 180, 216, 0.4);
      background: rgba(11, 13, 19, 0.28);
      opacity: 0; transition: opacity 120ms ease;
      pointer-events: none; z-index: 5;
    }
    .walker-joy::after {
      content: ''; position: absolute; inset: 40px; border-radius: 50%;
      border: 1px solid rgba(159, 180, 216, 0.22);
    }
    .walker-joy-knob {
      position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
      margin: -26px 0 0 -26px; border-radius: 50%;
      border: 2px solid rgba(232, 179, 75, 0.8);
      background: rgba(232, 179, 75, 0.22);
      will-change: transform;
    }
    .walker-jump {
      position: absolute;
      right: calc(env(safe-area-inset-right, 0px) + 20px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
      width: 96px; height: 96px; border-radius: 50%;
      border: 2px solid rgba(232, 179, 75, 0.65);
      background: rgba(232, 179, 75, 0.16);
      color: #ffd88a; font: 700 15px/1 ui-monospace, Menlo, monospace;
      letter-spacing: 0.08em;
      display: none; /* touch only — the controls module reveals it */
      touch-action: none; -webkit-user-select: none; user-select: none;
      z-index: 5;
    }
    .walker-jump.touch { display: block; }
    .walker-jump:active { background: rgba(232, 179, 75, 0.34); }
    /* the FAB sheet's extra rows (the walker's own buttons ride the
     * shell's menu — the fullscreen stage has no toolbar of its own) */
    .walker-btns {
      display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0;
      padding: 0 14px 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/demo-shell.js?v=221"></script>
  <script type="module" src="./main.js?v=221"></script>
</body>
</html>
