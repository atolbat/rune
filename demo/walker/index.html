<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>rune — first-person parkour walker</title>
  <link rel="stylesheet" href="../shared/demo-shell.css?v=216" />
  <style>
    /* the walker's own chrome: a GAME stage (portrait aware — the fov
       widens on tall screens), the touch controls' big target, and the
       compact HUD. Mobile-first: the jump button only appears on touch
       (the controls module flips it), the buttons row wraps. */
    .walker-stage { position: relative; aspect-ratio: 16 / 9; }
    @media (orientation: portrait) {
      .walker-stage { aspect-ratio: 3 / 4; }
    }
    .walker-stage canvas {
      display: block; width: 100%; height: 100%;
      background: #0b0d13; border-radius: 8px;
      touch-action: none; /* the pointer events own every touch */
    }
    .walker-hud {
      position: absolute; left: 10px; top: 10px; margin: 0;
      padding: 8px 10px; border-radius: 8px;
      background: rgba(8, 10, 16, 0.72); border: 1px solid #26304a;
      color: #9fb4d8; font: 11px/1.55 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre; pointer-events: none; max-width: calc(100% - 20px);
    }
    .walker-hud b { color: #e8b34b; }
    .walker-jump {
      position: absolute; right: 18px; bottom: 18px;
      width: 84px; height: 84px; border-radius: 50%;
      border: 2px solid rgba(232, 179, 75, 0.65);
      background: rgba(232, 179, 75, 0.16);
      color: #ffd88a; font: 700 14px/1 ui-monospace, Menlo, monospace;
      letter-spacing: 0.08em;
      display: none; /* touch only — the controls module reveals it */
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    .walker-jump.touch { display: block; }
    .walker-jump:active { background: rgba(232, 179, 75, 0.34); }
    .walker-btns {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/demo-shell.js?v=216"></script>
  <script type="module" src="./main.js?v=216"></script>
</body>
</html>
