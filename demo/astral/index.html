<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>rune — astral</title>
  <link rel="stylesheet" href="../shared/demo-shell.css" />
  <style>
    /* The game owns every gesture on its surface: the canvas carries
       touch-action:none (the field report — the page pinch ate the game
       pinch) and the page refuses overscroll. The game UI floats over the
       shell's fullscreen stage. Mobile-first: compact chips, >= 40px touch
       targets, safe-area insets everywhere.
       THE STELLARIS RESTYLE (Task 170): dark slate panels with thin steel
       borders and a whisper of inner light, gold trims on the interactive
       chrome, the self-hosted Oxanium variable font (the Eurostile-ish
       squared sci-fi face), teal selection, and resource chips in the
       Stellaris resource colors. */

    /* the sci-fi face — self-hosted (14 KB variable font, weights 200-800;
       the fetch happened at build time, zero network at play time) */
    @font-face {
      font-family: 'Oxanium';
      src: url('./assets/fonts/oxanium-var.woff2') format('woff2');
      font-weight: 200 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --as-gold: #c9a86a;
      --as-gold-bright: #ffd98f;
      --as-steel: #2e3a48;
      --as-slate: #141a22;
      --as-ink: #0d1218;
      --as-teal: #59e8cf;
    }

    html, body { overscroll-behavior: none; }
    #canvas { touch-action: none; -webkit-user-select: none; user-select: none; }
    .as-root {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      font: 13px/1.35 'Oxanium', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #dfe5f1;
      letter-spacing: 0.02em;
    }
    .as-root button { touch-action: manipulation; }

    /* ── the top bar: a slate command strip ── */
    .as-top {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 8px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 20px);
      padding: 6px 12px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgb(23 30 39 / 0.92), rgb(13 18 24 / 0.92));
      border: 1px solid var(--as-steel);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 4px 18px rgb(0 0 0 / 0.45);
      backdrop-filter: blur(8px);
      pointer-events: auto;
      flex-wrap: wrap;
      justify-content: center;
    }
    .as-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 8px;
      border-radius: 2px;
      border: 1px solid rgb(201 168 106 / 0.35);
      background: rgb(201 168 106 / 0.08);
      color: var(--as-gold-bright);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .as-res { display: flex; gap: 6px; }
    .as-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 2px;
      background: rgb(10 14 19 / 0.85);
      border: 1px solid #232e3b;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.04);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* Stellaris resource colors: minerals teal, energy gold, science violet */
    .as-min { color: #7fe3d2; }
    .as-energy { color: var(--as-gold-bright); }
    .as-sci { color: #c9a2f5; }

    .as-territory { display: flex; flex-direction: column; gap: 3px; min-width: 132px; }
    .as-terr-bar {
      position: relative;
      height: 6px;
      border-radius: 1px;
      background: #10161f;
      border: 1px solid #232e3b;
      overflow: hidden;
    }
    .as-terr-you, .as-terr-rival { position: absolute; top: 0; bottom: 0; }
    .as-terr-you { left: 0; background: linear-gradient(90deg, #2b5bd8, #7aa2f7); box-shadow: 0 0 6px rgb(122 162 247 / 0.5); }
    .as-terr-rival { right: 0; background: linear-gradient(270deg, #8f2f2a, #e0685f); box-shadow: 0 0 6px rgb(224 104 95 / 0.5); }
    .as-terr-label { font-size: 10px; color: #6b7691; text-align: center; white-space: nowrap; letter-spacing: 0.06em; }

    .as-speed { display: flex; gap: 3px; }
    .as-speed button {
      min-width: 34px;
      height: 34px;
      border-radius: 2px;
      border: 1px solid #2c3855;
      background: linear-gradient(180deg, #212a36, #171e28);
      color: #6b7691;
      font: 600 12px/1 'Oxanium', system-ui, sans-serif;
      cursor: pointer;
    }
    .as-speed button.as-active {
      border-color: rgb(89 232 207 / 0.55);
      color: var(--as-teal);
      background: rgb(89 232 207 / 0.10);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.06);
    }

    /* ── the labels ── */
    .as-labels { position: absolute; inset: 0; overflow: hidden; }
    .as-label {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      transform-origin: center top;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgb(0 0 0 / 0.9);
    }
    .as-label-name { font-size: 11px; font-weight: 600; color: #97a3b5; letter-spacing: 0.04em; }
    .as-label-sub { font-size: 9px; color: #5a647d; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
    .as-label.as-owned .as-label-name { color: #9ecbff; }
    .as-label.as-owned .as-label-sub { color: #6f87b4; }
    .as-label.as-rival .as-label-name { color: #ff9a93; }
    .as-label.as-rival .as-label-sub { color: #b0665f; }

    /* ── the bottom panel: a Stellaris slate card with gold corner ticks ── */
    .as-panel {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      width: min(430px, calc(100% - 16px));
      max-height: 42vh;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 11px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgb(23 30 39 / 0.94), rgb(13 18 24 / 0.94));
      border: 1px solid var(--as-steel);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 8px 28px rgb(0 0 0 / 0.55);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.18s, transform 0.18s;
      overflow: hidden auto;
    }
    .as-panel.as-open { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* the gold corner ticks — the Stellaris panel flourish */
    .as-panel::before, .as-panel::after {
      content: '';
      position: absolute;
      width: 15px;
      height: 15px;
      border: 1px solid rgb(201 168 106 / 0.9);
      pointer-events: none;
    }
    .as-panel::before { top: 3px; left: 3px; border-right: none; border-bottom: none; }
    .as-panel::after { bottom: 3px; right: 3px; border-left: none; border-top: none; }
    .as-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgb(201 168 106 / 0.35);
    }
    .as-panel-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ecd9ab;
    }
    .as-back {
      min-height: 40px;
      padding: 0 12px;
      border-radius: 2px;
      border: 1px solid #2c3855;
      background: linear-gradient(180deg, #212a36, #171e28);
      color: #9ecbff;
      font: 600 12px/1 'Oxanium', system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .as-panel-body { display: flex; flex-direction: column; gap: 6px; }
    .as-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .as-row.as-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .as-dim { color: #6b7691; font-size: 12px; letter-spacing: 0.02em; }
    .as-you { color: #7aa2f7; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .as-riv { color: #e0685f; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
    .as-neutral { color: #9aa4bd; font-size: 12px; }
    .as-progress { color: var(--as-teal); font-size: 12px; font-variant-numeric: tabular-nums; }
    .as-planet-row {
      padding: 6px 8px;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      justify-content: space-between;
    }
    .as-planet-row:hover { border-color: rgb(201 168 106 / 0.4); background: rgb(20 26 34 / 0.7); }
    .as-planet-name { font-size: 12px; font-weight: 600; }
    .as-built {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 2px;
      background: #1a2336;
      border: 1px solid #232e3b;
      color: #8fb7ff;
      font-size: 11px;
      letter-spacing: 0.03em;
    }
    .as-btn {
      min-height: 40px;
      padding: 0 12px;
      border-radius: 2px;
      border: 1px solid #3a4a5c;
      background: linear-gradient(180deg, #232c38, #1a212b);
      color: #cfe0ee;
      font: 600 11px/1.2 'Oxanium', system-ui, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      flex: 1 1 auto;
    }
    .as-btn:disabled { opacity: 0.45; cursor: default; }
    .as-btn:not(:disabled):hover {
      border-color: var(--as-gold);
      color: var(--as-gold-bright);
      background: linear-gradient(180deg, #2a3442, #1e2630);
    }

    /* ── the outcome overlay ── */
    .as-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgb(4 6 10 / 0.72);
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }
    .as-overlay[hidden] { display: none; }
    .as-overlay-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 28px 34px;
      border-radius: 3px;
      background: linear-gradient(180deg, #18202b, #0e1319);
      border: 1px solid var(--as-steel);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 12px 40px rgb(0 0 0 / 0.6);
      text-align: center;
      max-width: calc(100% - 32px);
      position: relative;
    }
    .as-overlay-card::before, .as-overlay-card::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid rgb(201 168 106 / 0.6);
      pointer-events: none;
    }
    .as-overlay-card::before { top: 4px; left: 4px; border-right: none; border-bottom: none; }
    .as-overlay-card::after { bottom: 4px; right: 4px; border-left: none; border-top: none; }
    .as-overlay-card h2 { margin: 0; font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase; }
    .as-overlay-card h2.as-win { color: var(--as-teal); }
    .as-overlay-card h2.as-lose { color: #e0685f; }
    .as-overlay-card p { margin: 0; color: #6b7691; font-size: 12px; }
    .as-overlay-card button {
      min-height: 44px;
      padding: 0 20px;
      border-radius: 2px;
      border: 1px solid var(--as-gold);
      background: linear-gradient(180deg, #2a221a, #1c1712);
      color: var(--as-gold-bright);
      font: 700 13px/1 'Oxanium', system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* ── the hint ── */
    .as-hint {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: calc(env(safe-area-inset-top, 0px) + 64px);
      padding: 5px 12px;
      border-radius: 2px;
      background: rgb(13 18 24 / 0.78);
      border: 1px solid #232e3b;
      color: #8d99b6;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: opacity 0.6s;
    }
    .as-hint.as-gone { opacity: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/demo-shell.js"></script>
  <script type="module" src="./main.js?v=4"></script>
</body>
</html>
